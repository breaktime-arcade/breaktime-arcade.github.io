<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>톡! 오목 - AI 대결·2인용 무료 오목 게임 (Tok Omok)</title>
<meta name="description" content="설치 없이 바로 하는 무료 오목 게임. AI 난이도 3단계와 2인용, 자유룰·렌주룰을 지원해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#f0c87e; --wood-d:#a8702f; --ink:#4a2e1e; --cream:#fff8ec;
  --red:#e8584c; --red-d:#ad3229; --green:#45a852; --green-d:#2c7a37; --blue:#4a86d8; --blue-d:#2f5fa3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:radial-gradient(circle at 30% 0%,#e9f3ff,#bcd8f2 55%,#9cc2e6);
  color:var(--ink); user-select:none; -webkit-user-select:none; touch-action:manipulation; word-break:keep-all;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;}

#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px 4px;}
#turnChip{
  flex:1;min-width:0;background:var(--cream);border:3px solid var(--wood-d);border-radius:14px;height:42px;
  display:flex;align-items:center;gap:8px;padding:0 12px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.15);
  white-space:nowrap;overflow:hidden;
}
#turnStone{width:22px;height:22px;border-radius:50%;flex:0 0 auto;box-shadow:inset -3px -3px 5px rgba(0,0,0,.25);}
#turnStone.b{background:radial-gradient(circle at 35% 30%,#777,#111 70%);}
#turnStone.w{background:radial-gradient(circle at 35% 30%,#fff,#d5d5d5 75%);border:1px solid #999;}
#turnText{overflow:hidden;text-overflow:ellipsis;}
.dots::after{content:'';animation:dots 1s steps(4) infinite;}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.ibtn{
  width:42px;height:42px;border-radius:12px;border:3px solid var(--wood-d);background:var(--cream);
  font-size:19px;cursor:pointer;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.15);flex:0 0 auto;
  color:var(--ink);font-family:inherit;line-height:1;
}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
.ibtn:disabled{opacity:.45;cursor:default;}
.badge{
  position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:12px;
  border-radius:10px;padding:2px 6px;border:2px solid #fff;line-height:1;
}

#stage{flex:1;position:relative;min-height:0;}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#toast{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(60,35,15,.88);color:#fff;
  padding:7px 14px;border-radius:14px;font-size:16px;pointer-events:none;opacity:0;transition:opacity .25s;
  white-space:nowrap;z-index:5;
}
#toast.show{opacity:1;}

.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px;z-index:10;}
.overlay.show{display:flex;}
.dim{background:rgba(30,40,60,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;}
.panel{
  background:var(--cream);border:4px solid var(--wood-d);border-radius:26px;padding:20px 18px;
  width:100%;max-width:370px;max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.18);animation:pop .25s ease-out;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.title{font-size:40px;color:var(--ink);text-shadow:0 3px 0 #fff,0 5px 0 rgba(0,0,0,.12);line-height:1.1;}
.title .b{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#777,#111 70%);vertical-align:-2px;}
.title .w{display:inline-block;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d5d5d5 75%);border:1px solid #999;vertical-align:-2px;margin-left:-10px;}
.sub{font-size:17px;margin:6px 0 12px;}
.opt{margin:10px 0;text-align:left;}
.opt label{display:block;font-size:15px;color:#8a6a4a;margin-bottom:4px;}
.seg{display:flex;gap:6px;}
.seg button{
  flex:1;border:2px solid #d9bb8d;background:#fff;border-radius:12px;padding:8px 4px;font-family:inherit;
  font-size:16px;color:var(--ink);cursor:pointer;
}
.seg button.on{background:var(--wood);border-color:var(--wood-d);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);}
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:13px 10px;margin-top:12px;
  font-family:inherit;font-size:21px;color:#fff;cursor:pointer;background:var(--red);box-shadow:0 5px 0 var(--red-d);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d);}
.btn.plain{background:#e9d7b8;color:var(--ink);box-shadow:0 5px 0 #c4a77c;}
.btn.plain:active{box-shadow:0 2px 0 #c4a77c;}
.rec{margin-top:12px;font-size:16px;}
.row{display:flex;gap:8px;}
.row .btn{flex:1;}
.resEmoji{font-size:70px;line-height:1.1;}
.resTitle{font-size:34px;color:var(--red);}
.resMsg{font-size:16px;margin:4px 0 10px;}
.resInfo{background:#fff;border:2px solid #d9bb8d;border-radius:14px;padding:10px;font-size:16px;line-height:1.7;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="turnChip"><span id="turnStone" class="b"></span><span id="turnText">내 차례예요</span></div>
    <button class="ibtn" id="btnUndo" aria-label="무르기">↩<span class="badge" id="undoBadge">3</span></button>
    <button class="ibtn" id="btnHint" aria-label="힌트">💡<span class="badge" id="hintBadge">3</span></button>
    <button class="ibtn" id="btnHome" aria-label="처음으로">🏠</button>
    <button class="ibtn" id="btnSound" aria-label="효과음 켜기/끄기">🔊</button>
  </div>

  <div id="stage">
    <canvas id="board"></canvas>
    <div id="toast"></div>
  </div>

  <div class="overlay dim show" id="menu">
    <div class="panel">
      <div class="title"><span class="b"></span><span class="w"></span> 톡! 오목</div>
      <p class="sub">가로·세로·대각선으로 다섯 개를 먼저 이으면 승리!</p>
      <div class="opt">
        <label>게임 방식</label>
        <div class="seg" data-key="mode">
          <button data-v="ai">🤖 AI 대결</button><button data-v="pvp">👫 2인용</button>
        </div>
      </div>
      <div class="opt aiOnly">
        <label>AI 난이도</label>
        <div class="seg" data-key="level">
          <button data-v="easy">쉬움</button><button data-v="normal">보통</button><button data-v="hard">어려움</button>
        </div>
      </div>
      <div class="opt aiOnly">
        <label>먼저 두기 (흑돌)</label>
        <div class="seg" data-key="first">
          <button data-v="me">내가 흑</button><button data-v="ai">AI가 흑</button><button data-v="random">랜덤</button>
        </div>
      </div>
      <div class="opt">
        <label>규칙</label>
        <div class="seg" data-key="rule">
          <button data-v="free">자유룰</button><button data-v="renju">렌주룰</button>
        </div>
      </div>
      <p class="sub hidden" id="renjuInfo" style="font-size:14px;margin:4px 0 0;color:#8a6a4a;">렌주룰: 흑돌만 3-3, 4-4, 여섯 개 이상 잇기가 금지돼요.</p>
      <button class="btn" id="btnStart">시작하기</button>
      <div class="rec aiOnly" id="menuRec"></div>
    </div>
  </div>

  <div class="overlay dim" id="confirm">
    <div class="panel">
      <div class="title" style="font-size:28px">처음으로 갈까요?</div>
      <p class="sub">지금 두던 판은 사라져요.</p>
      <div class="row">
        <button class="btn plain" id="btnNo">계속 두기</button>
        <button class="btn" id="btnYes">처음으로</button>
      </div>
    </div>
  </div>

  <div class="overlay dim" id="result">
    <div class="panel">
      <div class="resEmoji" id="resEmoji">🎉</div>
      <div class="resTitle" id="resTitle">이겼어요!</div>
      <div class="resMsg" id="resMsg"></div>
      <div class="resInfo" id="resInfo"></div>
      <div class="row">
        <button class="btn" id="btnAgain">다시 하기</button>
        <button class="btn plain" id="btnMenu">처음으로</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
