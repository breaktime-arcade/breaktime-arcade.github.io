<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14102a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>난투 전선 - 쉬는시간 오락실</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#0b0918;overflow:hidden;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative}
#game,#hud{display:block;touch-action:none}
#hud{position:absolute;left:0;top:0}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10}
.ov.on{display:flex}
#rotate{background:#0b0918;z-index:50;flex-direction:column;gap:14px;font-size:18px;text-align:center}
#rotate .ph{width:46px;height:78px;border:4px solid #ffd45c;border-radius:10px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
/* 로비 */
#lobby{background:radial-gradient(ellipse at 30% 20%,#3a2a7a 0%,#17123a 55%,#0b0918 100%)}
.panel{width:min(96vw,960px);height:min(96vh,540px);display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:auto 1fr auto;gap:1.4vh 2vw;padding:2.2vh 2.4vw}
.ttl{grid-column:1/3;display:flex;align-items:flex-end;justify-content:space-between}
.ttl h1{font-size:clamp(22px,5.4vh,40px);letter-spacing:2px;background:linear-gradient(#fff6c8,#ffb733);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6b2b00)}
.ttl small{opacity:.6;font-size:clamp(9px,2vh,12px)}
.box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:.9vh;min-height:0}
.box h2{font-size:clamp(12px,2.6vh,16px);color:#ffd45c}
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;flex:1;min-height:0}
.cmd{border-radius:12px;background:linear-gradient(#2c2560,#1c1840);border:2px solid transparent;padding:.8vh .5vw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5vh;cursor:pointer;min-height:0;transition:transform .1s}
.cmd:active{transform:scale(.97)}
.cmd.sel{border-color:#ffd45c;box-shadow:0 0 16px rgba(255,212,92,.45)}
.cmd canvas{width:clamp(40px,12vh,80px);height:clamp(40px,12vh,80px)}
.cmd b{font-size:clamp(11px,2.6vh,15px)}
.cmd .role{font-size:clamp(9px,2vh,12px);padding:1px 8px;border-radius:9px;background:#463a8c}
.cmd .d{font-size:clamp(8px,1.8vh,11px);opacity:.82;text-align:center;line-height:1.3}
.cmd .lv{font-size:clamp(9px,2vh,12px);color:#9fe7ff;display:flex;align-items:center;gap:4px}
.xb2{display:inline-block;width:40px;height:4px;background:#0006;border-radius:3px;overflow:hidden}
.xb2 i{display:block;height:100%;background:#5fd3ff}
.tbtn{font-family:inherit;font-size:clamp(9px,2vh,12px);font-weight:700;border:none;border-radius:8px;padding:.5vh 10px;background:#5a4aa8;color:#fff;letter-spacing:1px;cursor:pointer}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:.6vw}
.stg{padding:.6vh 0;border-radius:9px;background:#2a2458;text-align:center;font-weight:800;font-size:clamp(11px,2.6vh,15px);cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.stg small{font-size:clamp(7px,1.6vh,10px);color:#ffd45c;letter-spacing:-1px}
.stg.ch1{background:#5a3424}.stg.ch2{background:#2a4a64}.stg.ch3{background:#4a1a1a}
.stg.sel{border-color:#ffd45c;filter:brightness(1.35)}
.stg.lock{opacity:.35;cursor:default}
#stInfo{font-size:clamp(9px,2vh,12px);line-height:1.45;background:#0003;border-radius:8px;padding:.6vh .8vw}
#stInfo span{opacity:.75}
.deck{display:grid;grid-template-columns:repeat(6,1fr);gap:.5vw}
.dk{background:#221d4a;border-radius:9px;display:flex;flex-direction:column;align-items:center;padding:.4vh 0;font-size:clamp(8px,1.8vh,11px);border:1px solid transparent}
.dk.evo{border-color:#ffd45c;box-shadow:inset 0 0 10px rgba(255,212,92,.35)}
.dk canvas{width:clamp(24px,6.5vh,44px);height:clamp(24px,6.5vh,44px)}
.dk .xb{width:80%;height:4px;background:#0006;border-radius:3px;overflow:hidden;margin-top:2px}
.dk .xb i{display:block;height:100%;background:#5fd3ff}
.btns{grid-column:1/3;display:flex;gap:1vw}
.btn{flex:1;padding:1.6vh 0;border-radius:12px;border:none;font-weight:800;font-size:clamp(13px,3vh,18px);color:#2b1600;background:linear-gradient(#ffe68a,#ffb21f);box-shadow:0 4px 0 #a35b00;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a35b00}
.btn:disabled{filter:grayscale(.6);opacity:.8}
.btn.sub{background:linear-gradient(#5c5296,#3d3575);color:#ddd;box-shadow:0 4px 0 #231d4a;position:relative}
.btn.sub em{position:absolute;top:-8px;right:8px;font-style:normal;font-size:10px;background:#e2445c;color:#fff;padding:1px 6px;border-radius:8px}
/* 결과·일시정지·특성 */
#result,#pause,#talent{background:rgba(8,6,20,.72);backdrop-filter:blur(3px)}
#talent{z-index:20}
.res{width:min(90vw,640px);max-height:94vh;background:linear-gradient(#2c2560,#18143a);border:2px solid #ffd45c;border-radius:18px;padding:2vh 2.4vw;display:flex;flex-direction:column;gap:1vh;align-items:center}
.res h1{font-size:clamp(24px,6.4vh,44px)}
.res h1.win{color:#ffd45c;text-shadow:0 0 18px #ffb21f}
.res h1.lose{color:#ff7b8b}
#resStars{font-size:clamp(22px,6vh,40px);letter-spacing:6px;color:#3a3466;line-height:1}
#resStars .on{color:#ffd45c;text-shadow:0 0 12px #ffb21f}
.res .st{font-size:clamp(10px,2.3vh,14px);opacity:.88;text-align:center}
.res .st small{opacity:.7}
.xpl{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:.8vh .8vw}
.xpi{background:#0004;border-radius:9px;padding:.5vh .6vw;font-size:clamp(9px,2vh,12px);display:flex;flex-direction:column;gap:2px}
.xpi .up{color:#7dff9a;font-weight:800}
.xpi .xb{height:5px;background:#0006;border-radius:3px;overflow:hidden}
.xpi .xb i{display:block;height:100%;background:#5fd3ff}
.res .btns{width:100%}
.trow{width:100%;display:grid;grid-template-columns:auto 1fr 1fr;gap:.8vw;align-items:stretch}
.trow.lock{opacity:.35}
.tlv{align-self:center;font-weight:800;color:#ffd45c;font-size:clamp(10px,2.4vh,14px);width:3.4em}
.topt{background:#221d4a;border:2px solid #3a3470;border-radius:10px;padding:.8vh .8vw;display:flex;flex-direction:column;gap:2px;cursor:pointer;font-size:clamp(9px,2.1vh,13px)}
.topt b{color:#fff}.topt span{opacity:.8}
.topt.sel{border-color:#ffd45c;background:#3a2f7a;box-shadow:0 0 10px rgba(255,212,92,.35)}
.thint{font-size:clamp(9px,2vh,12px);opacity:.7}

/* 협동 레이드 */
#coop{background:rgba(8,6,20,.82);backdrop-filter:blur(3px);z-index:15}
.res.cp{width:min(94vw,820px)}
.cp-head{width:100%;display:flex;justify-content:space-between;align-items:center}
.cp-head h1{font-size:clamp(18px,4.6vh,30px);color:#ffd45c}
.xbtn{background:#3a3470;color:#fff;border:none;border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer}
.cp-entry{width:100%;display:flex;flex-direction:column;gap:1.4vh;align-items:stretch}
.cp-nick{font-size:clamp(11px,2.6vh,15px);text-align:center}
.cp-nick b{color:#ffd45c}
.mini{font-family:inherit;border:none;border-radius:8px;background:#4a3f94;color:#fff;padding:.5vh 10px;font-size:clamp(10px,2.2vh,13px);cursor:pointer}
.cp-row{display:flex;gap:1vw}
.cp-row input{flex:1;font-family:inherit;font-size:clamp(14px,3.2vh,20px);text-align:center;letter-spacing:6px;border-radius:12px;border:2px solid #4a3f94;background:#15112e;color:#fff;padding:1vh;user-select:text;-webkit-user-select:text}
.btn.sub2{background:linear-gradient(#7a6ad8,#4f43a6);color:#fff;box-shadow:0 4px 0 #2a2366}
.cp-tip{font-size:clamp(9px,2vh,12px);opacity:.7;text-align:center}
.cp-msg{min-height:1.2em;font-size:clamp(10px,2.2vh,13px);text-align:center}
.cp-room{width:100%;display:flex;flex-direction:column;gap:1vh}
.cp-top{display:flex;justify-content:space-between;align-items:center;gap:1vw;flex-wrap:wrap}
.cp-code{font-size:clamp(12px,2.8vh,16px)}
.cp-code b{font-size:clamp(20px,5vh,32px);color:#ffd45c;letter-spacing:4px;margin-left:6px}
.cp-syn{display:flex;gap:6px;align-items:center;font-size:clamp(9px,2vh,12px)}
.cp-syn span{padding:2px 8px;border-radius:9px;background:#2a2458;opacity:.45}
.cp-syn span.on{opacity:1;background:#5a4ab0}
.cp-syn b{color:#ffe68a}.cp-syn small{opacity:.6}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:.8vw}
.slot{background:#221d4a;border:2px solid #3a3470;border-radius:12px;padding:.8vh .4vw;display:flex;flex-direction:column;align-items:center;gap:.3vh;font-size:clamp(9px,2vh,12px);text-align:center;min-height:clamp(90px,24vh,150px);justify-content:center}
.slot.me{background:#2e2768}
.slot.empty{opacity:.45;border-style:dashed}
.slot canvas{width:clamp(36px,10vh,64px);height:clamp(36px,10vh,64px)}
.slot b{font-size:clamp(10px,2.3vh,14px)}
.slot .rl{font-style:normal;color:#c9bfff}
.slot em{font-style:normal;font-weight:800;color:#9a92c8}
.slot em.rd{color:#7dff9a}.slot em.host{color:#ffd45c}
.cp-stage{display:flex;align-items:center;gap:8px;font-size:clamp(10px,2.3vh,14px);flex-wrap:wrap}
.cp-stage span{opacity:.75}

.slots.pvp{grid-template-columns:1fr auto 1fr;align-items:center}
.slots.pvp .team{display:grid;grid-template-columns:1fr 1fr;gap:.6vw;padding:.6vh .5vw;border-radius:12px}
.slots.pvp .team h3{grid-column:1/3;font-size:clamp(10px,2.3vh,14px);text-align:center}
.slots.pvp .team.blue{background:rgba(95,170,255,.12)}.slots.pvp .team.blue h3{color:#8fc8ff}
.slots.pvp .team.red{background:rgba(255,90,90,.12)}.slots.pvp .team.red h3{color:#ff9a9a}
.slots.pvp .slot{min-height:clamp(80px,21vh,130px)}
.vs{font-weight:900;font-size:clamp(16px,4vh,26px);color:#ffd45c;text-shadow:0 0 10px #ff8a2a}
.cp-rank{background:#0004;border-radius:10px;padding:.8vh 1vw;font-size:clamp(9px,2vh,12px);max-height:26vh;overflow:auto}
.rk-me{text-align:center;margin-bottom:.6vh}.rk-me b{color:#ffd45c;font-size:1.3em}
.rk-list{display:grid;grid-template-columns:1fr 1fr;gap:2px 1.4vw}
.rk-list div{display:flex;gap:6px;align-items:center}
.rk-list div span{width:1.6em;color:#ffd45c;font-weight:800}
.rk-list div b{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rk-list div em{font-style:normal;color:#9fe7ff;font-weight:800}
.rk-list div.me b{color:#7dff9a}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="game"></canvas><canvas id="hud"></canvas></div></div>

<div id="rotate" class="ov"><div class="ph"></div><div>화면을 <b style="color:#ffd45c">가로</b>로 돌려주세요</div></div>

<div id="lobby" class="ov on">
  <div class="panel">
    <div class="ttl"><h1>⚔️ 난투 전선</h1><small id="gid"></small></div>
    <div class="box">
      <h2>지휘관 선택</h2>
      <div class="cmds" id="cmds"></div>
    </div>
    <div class="box">
      <h2>캠페인</h2>
      <div class="stages" id="stages"></div>
      <div id="stInfo"></div>
      <h2>나의 부대</h2>
      <div class="deck" id="deck"></div>
    </div>
    <div class="btns">
      <button class="btn sub" id="coopBtn">🤝 협동 레이드 (2~4인)</button>
      <button class="btn sub" id="pvpBtn">⚔️ 대결 (1:1 · 2:2)</button>
      <button class="btn" id="startBtn">출전!</button>
    </div>
  </div>
</div>


<div id="coop" class="ov">
  <div class="res cp">
    <div class="cp-head"><h1 id="cpTitle">🤝 협동 레이드</h1><button id="cpBack" class="xbtn">✕</button></div>
    <div id="cpEntry" class="cp-entry">
      <div class="cp-nick">내 이름 <b id="cpNick">…</b> <button class="mini" id="cpReroll">다시 뽑기</button></div>
      <div class="cp-row"><button class="btn" id="cpCreate">방 만들기</button><button class="btn sub2" id="cpQuick">빠른 참가</button></div>
      <div class="cp-row"><input id="cpCode" inputmode="numeric" maxlength="4" placeholder="방 번호 4자리" autocomplete="off"><button class="btn sub2" id="cpJoin">번호로 참가</button><button class="btn sub2" id="cpAI" style="display:none">AI와 연습</button></div>
      <div class="cp-tip" id="cpTip">최대 4명이 한 전장에서 함께 싸워요. 인원이 많을수록 적도 강해져요.</div>
      <div id="cpRank" class="cp-rank" style="display:none"></div>
    </div>
    <div id="cpRoom" class="cp-room" style="display:none">
      <div class="cp-top"><div class="cp-code">방 번호 <b id="cpRoomCode"></b></div><div id="cpSyn" class="cp-syn"></div></div>
      <div id="cpSlots" class="slots"></div>
      <div class="cp-stage" id="cpStageRow"><button class="mini" id="cpStPrev">◀</button><b id="cpStage"></b><button class="mini" id="cpStNext">▶</button><span id="cpStInfo"></span></div>
      <div class="btns"><button class="btn sub2" id="cpLeave">나가기</button><button class="btn sub2" id="cpTeam" style="display:none">팀 바꾸기</button><button class="btn sub2" id="cpCmd">지휘관 바꾸기</button><button class="btn" id="cpGo">준비</button></div>
    </div>
    <div id="cpMsg" class="cp-msg"></div>
  </div>
</div>

<div id="talent" class="ov">
  <div class="res">
    <h1 id="talTitle" style="font-size:clamp(18px,4.4vh,28px);color:#ffd45c">특성</h1>
    <div class="thint">레벨 5 · 10 · 15에 하나씩 열려요. 언제든 바꿀 수 있어요.</div>
    <div id="talRows" style="width:100%;display:flex;flex-direction:column;gap:1vh"></div>
    <div class="btns"><button class="btn" id="talClose">확인</button></div>
  </div>
</div>

<div id="pause" class="ov">
  <div class="res">
    <h1 id="pauseTitle">일시정지</h1>
    <div class="btns"><button class="btn sub" id="toLobby">로비로</button><button class="btn" id="resume">계속하기</button></div>
  </div>
</div>

<div id="result" class="ov">
  <div class="res">
    <h1 id="resTitle">승리!</h1>
    <div id="resStars"></div>
    <div class="st" id="resStat"></div>
    <div class="xpl" id="resXp"></div>
    <div class="btns"><button class="btn sub" id="resLobby">로비로</button><button class="btn" id="resRetry">다시 하기</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.23.0/dist/pixi.min.js"></script>
<script src="../common/arcade.js" onerror="this.remove()"></script>
<script src="net.js"></script>
<script src="game.js"></script>
</body>
</html>
