<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>사과 게임 - 합 10 만들기 (Apple Ten)</title>
<meta name="description" content="숫자 사과를 네모로 묶어 합 10을 만드는 무료 웹 퍼즐 게임. 2분 안에 사과를 최대한 많이 따 보세요!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8413c; --red-d:#a92228; --green:#45a852; --green-d:#2c7a37;
  --wood:#f1d39b; --wood-d:#b98247; --ink:#4a2e1e; --cream:#fff8ec;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:radial-gradient(circle at 30% 0%,#e6f7d2,#b4e196 55%,#8cc970);
  color:var(--ink); user-select:none; -webkit-user-select:none; touch-action:manipulation; word-break:keep-all;
}
#app{position:fixed;inset:0;display:flex;flex-direction:column;}

/* 상단 정보줄 */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px 4px;}
.chip{
  background:var(--cream);border:3px solid var(--wood-d);border-radius:14px;
  padding:3px 12px;font-size:20px;display:flex;align-items:center;gap:4px;
  box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap;min-width:72px;justify-content:center;height:42px;
}
#timer{
  flex:1;position:relative;height:30px;min-width:60px;background:var(--cream);
  border:3px solid var(--wood-d);border-radius:15px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.15);
}
#timerFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#8fdc7a,#45a852);}
#timer.danger #timerFill{background:linear-gradient(#ff9a8c,#e8413c);animation:blink .45s infinite alternate;}
#timer.practice #timerFill{background:repeating-linear-gradient(45deg,#bfe8a8 0 12px,#a7dd8c 12px 24px);}
#timerText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;text-shadow:0 1px 0 #fff;}
@keyframes blink{from{opacity:1}to{opacity:.55}}
.ibtn{
  width:42px;height:42px;border-radius:12px;border:3px solid var(--wood-d);background:var(--cream);
  font-size:19px;cursor:pointer;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.15);flex:0 0 auto;
  color:var(--ink);font-family:inherit;line-height:1;
}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
.ibtn:disabled{opacity:.45;cursor:default;}
.badge{
  position:absolute;top:-8px;right:-8px;background:var(--red);color:#fff;font-size:12px;
  border-radius:10px;padding:2px 6px;border:2px solid #fff;line-height:1;
}

/* 게임판 */
#stage{flex:1;position:relative;min-height:0;}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}

/* 겹쳐 뜨는 화면 */
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px;z-index:10;}
.overlay.show{display:flex;}
.dim{background:rgba(60,40,20,.38);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;}
.solid{background:var(--wood);border-radius:14px;margin:6px;}
.panel{
  background:var(--cream);border:4px solid var(--wood-d);border-radius:26px;padding:22px 20px;
  width:100%;max-width:360px;max-height:100%;overflow:auto;text-align:center;
  box-shadow:0 8px 0 rgba(0,0,0,.18);animation:pop .25s ease-out;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.title{font-size:42px;color:var(--red);text-shadow:0 3px 0 #fff,0 5px 0 rgba(0,0,0,.12);line-height:1.1;}
.sub{font-size:18px;margin:6px 0 14px;}
.howto{
  background:#fff;border:2px dashed var(--wood-d);border-radius:16px;padding:10px 12px;
  font-size:15px;line-height:1.6;text-align:left;margin-bottom:14px;
}
.btn{
  display:block;width:100%;border:none;border-radius:16px;padding:13px 10px;margin-top:10px;
  font-family:inherit;font-size:21px;color:#fff;cursor:pointer;
  background:var(--red);box-shadow:0 5px 0 var(--red-d);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d);}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d);}
.btn.green:active{box-shadow:0 2px 0 var(--green-d);}
.btn.plain{background:#e9d7b8;color:var(--ink);box-shadow:0 5px 0 #c4a77c;}
.btn.plain:active{box-shadow:0 2px 0 #c4a77c;}
.btn small{font-size:14px;opacity:.9;}
.best{margin-top:14px;font-size:17px;}
.row{display:flex;gap:8px;}
.row .btn{flex:1;}

#cdText{font-size:110px;color:#fff;text-shadow:0 6px 0 var(--red-d),0 0 30px rgba(0,0,0,.25);animation:pop .3s ease-out;}
#cdOverlay{background:var(--wood);border-radius:14px;margin:6px;}

/* 결과 */
.resEmoji{font-size:70px;line-height:1.1;}
.resGrade{font-size:32px;color:var(--red);}
.resMsg{font-size:16px;margin:4px 0 12px;}
.resReason{font-size:16px;color:#8a6a4a;margin-bottom:6px;}
.scoreBox{display:flex;gap:8px;margin-bottom:6px;}
.scoreBox div{flex:1;background:#fff;border:2px solid var(--wood-d);border-radius:14px;padding:8px 4px;}
.scoreBox b{display:block;font-size:34px;font-weight:normal;color:var(--ink);}
.scoreBox span{font-size:14px;color:#8a6a4a;}
.newRec{
  display:inline-block;background:#ffd84d;border-radius:12px;padding:4px 12px;font-size:17px;
  margin:4px 0;animation:wiggle .6s infinite alternate;
}
@keyframes wiggle{from{transform:rotate(-4deg) scale(1)}to{transform:rotate(4deg) scale(1.08)}}
.note{font-size:14px;color:#8a6a4a;margin-top:4px;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip" aria-label="점수">🍎 <span id="score">0</span></div>
    <div id="timer"><div id="timerFill"></div><div id="timerText">2:00</div></div>
    <button class="ibtn" id="btnHint" aria-label="힌트">💡<span class="badge" id="hintBadge">3</span></button>
    <button class="ibtn" id="btnPause" aria-label="일시정지" style="font-weight:bold">II</button>
    <button class="ibtn" id="btnSound" aria-label="효과음 켜기/끄기">🔊</button>
  </div>

  <div id="stage">
    <canvas id="board"></canvas>
    <div class="overlay" id="cdOverlay"><div id="cdText">3</div></div>
    <div class="overlay solid" id="pauseOverlay">
      <div class="panel">
        <div class="title" style="font-size:34px">잠깐 쉬는 중</div>
        <p class="sub">사과판은 살짝 가려 둘게요 🙈</p>
        <button class="btn green" id="btnResume">계속하기</button>
        <button class="btn" id="btnRestart">다시 하기</button>
        <button class="btn plain" id="btnToMenu">처음으로</button>
      </div>
    </div>
  </div>

  <div class="overlay dim show" id="menu">
    <div class="panel">
      <div class="title">🍎 사과 게임</div>
      <p class="sub">합이 10이 되게 사과를 묶어 따 보세요!</p>
      <div class="howto">
        ① 손가락이나 마우스로 <b>네모를 그려요</b><br>
        ② 네모 안 숫자의 합이 <b>딱 10</b>이면 사과를 따요<br>
        ③ 많이 묶을수록 점수가 쑥쑥! 빈칸은 0이에요
      </div>
      <button class="btn" id="btnNormal">기본 모드 <small>(2분)</small></button>
      <button class="btn green" id="btnPractice">연습 모드 <small>(시간 무제한)</small></button>
      <div class="best">🏆 내 최고 기록: <span id="menuBest">0</span>개</div>
    </div>
  </div>

  <div class="overlay dim" id="result">
    <div class="panel">
      <div class="resReason" id="resReason">시간 끝!</div>
      <div class="resEmoji" id="resEmoji">🍎</div>
      <div class="resGrade" id="resGrade">사과 농부</div>
      <div class="resMsg" id="resMsg"></div>
      <div class="scoreBox">
        <div><b id="resScore">0</b><span>이번 점수</span></div>
        <div id="resBestBox"><b id="resBest">0</b><span>최고 기록</span></div>
      </div>
      <div class="newRec hidden" id="resNew">🎉 신기록!</div>
      <div class="note" id="resNote"></div>
      <div class="row">
        <button class="btn" id="btnAgain">다시 하기</button>
        <button class="btn plain" id="btnHome">처음으로</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
<script src="../common/arcade.js" data-pos="ml" defer></script>
</body>
</html>
