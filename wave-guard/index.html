<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>파도풀 안전요원</title>
<meta name="description" content="워터파크 파도풀의 안전요원이 되어 위험에 빠진 이용객을 찾아 대응하는 3D 웹게임">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--red:#ff3b30;--yel:#ffd23f;--ink:#0b1b2b;--glass:rgba(8,24,40,.55);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1b2b;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:linear-gradient(#1a6fb0,#0b3a63);z-index:50;transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#loading .spin{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud button{pointer-events:auto}
.hud-l{position:absolute;left:12px;top:12px;padding:10px 14px;min-width:190px}
.shift-name{font-weight:800;font-size:15px;letter-spacing:-.2px}
.timer-row{display:flex;align-items:center;gap:10px;margin-top:6px}
#h-time{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;min-width:48px}
#h-time.warn{color:var(--yel);animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.4}}
.bar{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4fd1ff,#ffd23f);border-radius:9px;transition:width .3s linear}
.hud-c{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center}
.score{font-weight:900;font-size:40px;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.45),0 0 2px #000;font-variant-numeric:tabular-nums}
.combo{margin-top:4px;font-weight:800;font-size:14px;color:var(--ink);background:var(--yel);border-radius:20px;padding:3px 10px;display:inline-block;opacity:0;transform:scale(.6);transition:.2s}
.combo.on{opacity:1;transform:scale(1)}
.hud-r{position:absolute;right:12px;top:12px;display:flex;gap:8px;align-items:center}
.hearts{padding:8px 12px;font-size:20px;letter-spacing:2px}
.hearts .lost{opacity:.45}
.ib{width:44px;height:44px;font-size:19px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.ib:active{transform:scale(.92)}
.zoom{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.zoom .ib{font-size:24px;font-weight:700}
.tip{position:absolute;left:12px;bottom:14px;font-size:12.5px;opacity:.85;background:rgba(0,0,0,.35);padding:6px 10px;border-radius:10px;max-width:60vw}
/* 배너/자막 */
#banner{position:fixed;left:50%;top:88px;transform:translate(-50%,-30px);opacity:0;z-index:12;pointer-events:none;padding:11px 20px;border-radius:14px;font-weight:800;font-size:17px;background:rgba(10,40,70,.85);border:1px solid var(--line);transition:.35s cubic-bezier(.2,1.4,.4,1);white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#banner.show{opacity:1;transform:translate(-50%,0)}
#banner.warn{background:linear-gradient(90deg,#ff8a00,#ffb300);color:#1d1200}
#banner.danger{background:linear-gradient(90deg,#d70015,#ff3b30);color:#fff}
#banner.info{background:rgba(10,60,110,.9)}
#subtitle{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:12;pointer-events:none;background:rgba(0,0,0,.72);padding:10px 18px;border-radius:12px;font-weight:700;font-size:16px;max-width:86vw;text-align:center;opacity:0;transition:.3s}
#subtitle.show{opacity:1}
/* 화면 효과 */
#vignette{position:fixed;inset:0;pointer-events:none;z-index:9;opacity:0}
#vignette.red{animation:vig 1.4s ease-out}
@keyframes vig{0%{opacity:1;box-shadow:inset 0 0 160px 60px rgba(255,0,0,.75)}100%{opacity:0;box-shadow:inset 0 0 160px 60px rgba(255,0,0,.75)}}
#glare{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity 2s;background:radial-gradient(circle at var(--gx,60%) var(--gy,45%),rgba(255,255,240,.95) 0,rgba(255,250,220,.75) 9%,rgba(255,240,200,.25) 24%,transparent 42%);mix-blend-mode:screen;animation:gl 9s ease-in-out infinite alternate}
#glare.on{opacity:1}
@keyframes gl{0%{--gx:30%;--gy:52%}100%{--gx:72%;--gy:40%}}
@property --gx{syntax:'<percentage>';inherits:false;initial-value:60%}
@property --gy{syntax:'<percentage>';inherits:false;initial-value:45%}
#rainfx{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;transition:opacity 2s;background:linear-gradient(rgba(60,80,100,.28),rgba(40,60,80,.18))}
#rainfx.on{opacity:1}
/* 월드 UI */
#world-ui{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.bubble{position:absolute;left:0;top:0;font-size:26px;background:#fff;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.bubble:after{content:'';position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.popup{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:26px;text-align:center;animation:pop 1.4s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.6);white-space:nowrap}
.popup small{display:block;font-size:13px;font-weight:700;margin-top:2px}
.popup.good{color:#7dffb0}.popup.bad{color:#ff6b6b}.popup.warn{color:var(--yel);font-size:18px}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%)}}
.arrow{position:absolute;left:0;top:0;width:44px;height:44px}
.arrow i{position:absolute;inset:0;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:22px;box-shadow:0 0 0 3px #fff,0 0 18px rgba(255,59,48,.8);animation:pulse .6s infinite alternate}
.arrow:after{content:'';position:absolute;right:-12px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:12px solid var(--red);border-right:0}
@keyframes pulse{to{transform:scale(1.12)}}
/* 도구 메뉴 */
#radial{position:fixed;inset:0;z-index:13;pointer-events:none}
.tool{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(10,30,50,.82);backdrop-filter:blur(6px);color:#fff;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;animation:tin .22s cubic-bezier(.2,1.5,.4,1) backwards;box-shadow:0 6px 18px rgba(0,0,0,.4);transition:background .15s,transform .05s linear}
.tool:hover{background:rgba(255,59,48,.9)}
.tool .ic{font-size:28px;line-height:1}
.tool .nm{position:absolute;top:100%;margin-top:3px;font-size:12px;font-weight:800;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 2px #000}
.tool .ky{position:absolute;right:-4px;top:-4px;width:19px;height:19px;border-radius:50%;background:var(--yel);color:#000;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center}
.tool.off{opacity:.35;filter:grayscale(1)}
#radial.locked .tool{opacity:.4;filter:grayscale(.8);pointer-events:none}
@keyframes tin{from{opacity:0;scale:.3}}
.ring-hint{display:none}
#radial.dock:before{content:'대응 도구를 고르세요';position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(transparent,rgba(5,20,35,.85));display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-size:12px;font-weight:700;opacity:.85}
body.radial-open .zoom{display:none}
/* 화면 */
#screens{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(5,20,35,.35),rgba(5,20,35,.75));padding:16px}
#screens.show{display:flex;animation:fade .35s}
#screens.title{background:linear-gradient(rgba(5,30,60,.15),rgba(5,25,45,.7))}
@keyframes fade{from{opacity:0}}
.panel{background:rgba(10,28,46,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:28px 30px;max-width:640px;width:100%;text-align:center;max-height:94vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:up .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
h1{font-size:46px;font-weight:900;letter-spacing:-1.5px;background:linear-gradient(#fff,#bfe8ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.4));margin-top:6px}
h2{font-size:26px;font-weight:900;letter-spacing:-.6px;margin-bottom:8px}
.sub{opacity:.9;font-size:15.5px;margin:8px 0 16px;line-height:1.5}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.btns.col{flex-direction:column;align-items:center}
.big{font-family:inherit;font-size:17px;font-weight:800;padding:14px 26px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;min-width:180px;transition:transform .1s,background .2s}
.big:hover{background:rgba(255,255,255,.2)}.big:active{transform:scale(.96)}
.big.primary{background:linear-gradient(#ff5a4f,#e0251b);border-color:#ff8a82;box-shadow:0 6px 20px rgba(255,59,48,.4)}
.best{margin-top:14px;opacity:.85}.foot{margin-top:12px;font-size:12.5px;opacity:.6}
.title-art{position:relative;height:110px;margin:-6px auto 0;width:220px;overflow:hidden;border-radius:0 0 60px 60px}
.title-art .sun{position:absolute;left:50%;top:10px;width:70px;height:70px;margin-left:-35px;border-radius:50%;background:radial-gradient(#fff6c4,#ffcf3f);box-shadow:0 0 40px #ffd23f}
.title-art .wv{position:absolute;left:-20%;width:140%;height:60px;border-radius:45%;}
.wv.w1{top:58px;background:#3fc6e8;animation:wv 3s ease-in-out infinite alternate}
.wv.w2{top:70px;background:#1f9fd6;animation:wv 2.4s ease-in-out infinite alternate-reverse}
.wv.w3{top:84px;background:#127cb5;animation:wv 2.8s ease-in-out infinite alternate}
@keyframes wv{from{transform:translateX(-6%) rotate(-2deg)}to{transform:translateX(6%) rotate(2deg)}}
.buoy-ic{position:absolute;left:50%;top:44px;font-size:40px;margin-left:-20px;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(8px) rotate(10deg)}}
.g-grid{display:grid;gap:8px;text-align:left;margin-top:10px}
.g-row{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px}
.g-tool{display:flex;flex-direction:column;align-items:center;min-width:78px;position:relative}
.g-tool span{font-size:30px}.g-tool b{font-size:13px;margin-top:2px}
.g-tool i{position:absolute;top:-4px;right:6px;background:var(--yel);color:#000;font-style:normal;font-weight:900;font-size:11px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.g-row ul{list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.g-row li{background:rgba(255,255,255,.1);border-radius:8px;padding:4px 8px;font-size:13.5px}
.g-tips{text-align:left;margin-top:12px;font-size:14px;line-height:1.7;background:rgba(0,0,0,.2);border-radius:14px;padding:10px 14px}
.shift-no{display:inline-block;background:var(--yel);color:#000;font-weight:900;border-radius:20px;padding:4px 14px;font-size:14px;margin-bottom:10px}
.sec{font-weight:800;font-size:14px;opacity:.8;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:rgba(255,255,255,.12);border-radius:20px;padding:6px 12px;font-weight:700;font-size:14px}
.chip.ev{background:rgba(255,138,0,.28)}
.grade{font-size:92px;font-weight:900;line-height:1;margin:6px 0 4px;text-shadow:0 6px 24px rgba(0,0,0,.4)}
.g-S{color:#ffd23f}.g-A{color:#7dffb0}.g-B{color:#7ac8ff}.g-C{color:#e0e0e0}.g-D{color:#ff8a80}
.stats{display:grid;gap:6px;max-width:360px;margin:12px auto 0}
.stats div{display:flex;justify-content:space-between;background:rgba(255,255,255,.07);padding:9px 14px;border-radius:10px;font-size:15px}
.stats b{font-weight:900}.stats b.bad{color:#ff6b6b}
.stats .tot{background:rgba(255,210,63,.18)}.stats .tot b{color:var(--yel);font-size:18px}
.count{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:110px;font-weight:900;z-index:30;pointer-events:none;text-shadow:0 8px 30px rgba(0,0,0,.5);animation:cnt .75s ease-out}
.count.go{font-size:64px;color:var(--yel)}
@keyframes cnt{from{transform:translate(-50%,-50%) scale(1.8);opacity:0}30%{opacity:1}}
@media (max-width:640px){
  .hud-l{min-width:0;padding:7px 10px}.shift-name{font-size:12.5px}#h-time{font-size:16px}
  .score{font-size:30px}.hud-c{top:58px}
  .hearts{font-size:15px;padding:6px 8px}.ib{width:38px;height:38px;font-size:16px}
  .tip{display:none}#banner{font-size:14px;top:118px;white-space:normal;width:90vw;text-align:center}
  h1{font-size:36px}.panel{padding:22px 16px}.big{min-width:140px;font-size:15.5px;padding:12px 18px}
  .tool{width:56px;height:56px}.tool .ic{font-size:24px}.grade{font-size:72px}
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="glare"></div><div id="rainfx"></div><div id="vignette"></div>
<div id="world-ui"></div>
<div id="hud" class="hidden"></div>
<div id="banner"></div>
<div id="subtitle"></div>
<div id="radial" class="hidden"></div>
<div id="screens"></div>
<div id="loading"><div class="spin"></div><p>파도풀 개장 준비 중...</p></div>
<script type="module" src="js/main.js"></script>
<script src="../common/arcade.js" defer></script>
</body>
</html>
