<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>지진 설계사</title>
<meta name="description" content="정해진 예산으로 기둥·보·가새를 배치해 건물을 짓고, 지진을 버티면 클리어하는 3D 물리 퍼즐 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3b2f2a;
    --ink-soft: #7a6a60;
    --paper: #fffaf0;
    --line: #ead9c2;
    --orange: #f2994a;
    --yellow: #f6c344;
    --teal: #3cb4a0;
    --purple: #8e6bd8;
    --red: #e5484d;
    --green: #4caf6a;
    --shadow: 0 4px 0 rgba(59, 47, 42, .18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Gowun Dodum', sans-serif;
    color: var(--ink);
    background: linear-gradient(#8fd3f4 0%, #c8ecfb 55%, #fdf3dc 100%);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  #app { position: fixed; inset: 0; height: 100dvh; }
  canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .jua { font-family: 'Jua', sans-serif; }
  button { font-family: 'Jua', sans-serif; color: var(--ink); cursor: pointer; border: none; }

  /* 상단 정보 */
  #hud {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; gap: 8px; align-items: flex-start; justify-content: space-between;
    pointer-events: none;
  }
  .card {
    background: var(--paper); border: 2px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 8px 12px; pointer-events: auto;
  }
  #levelInfo .title { font-family: 'Jua', sans-serif; font-size: 18px; line-height: 1.2; }
  #levelInfo .chips { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #f3e7d4; white-space: nowrap; }
  .chip.soil { background: #e9dcc5; }
  .chip.quake { background: #ffd9d6; color: #a23a3a; }
  #budgetBox { min-width: 170px; text-align: right; }
  #budgetBox .label { font-size: 12px; color: var(--ink-soft); }
  #budgetText { font-family: 'Jua', sans-serif; font-size: 20px; }
  #budgetBar { height: 8px; background: #f0e4d0; border-radius: 99px; margin-top: 4px; overflow: hidden; position: relative; }
  #budgetFill { height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .2s, background .2s; }
  .parMark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #b89b6e; }
  #starGuide { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .shake { animation: shake .35s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #topRight { display: flex; gap: 8px; align-items: flex-start; }
  .iconBtn {
    width: 40px; height: 40px; border-radius: 12px; background: var(--paper); border: 2px solid var(--line);
    box-shadow: var(--shadow); font-size: 18px; pointer-events: auto; display: grid; place-items: center;
  }
  .iconBtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(59,47,42,.18); }

  /* 팁 말풍선 */
  #tip {
    position: absolute; top: 86px; left: 50%; transform: translateX(-50%);
    max-width: min(520px, calc(100% - 24px)); font-size: 14px; line-height: 1.5;
    display: flex; gap: 10px; align-items: flex-start;
  }
  #tip .face { font-size: 22px; line-height: 1; }
  #tip button { background: none; font-size: 16px; padding: 0 0 0 4px; color: var(--ink-soft); }
  #tip.hidden { display: none; }

  /* 하단 도구 */
  #toolbar {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: stretch; padding: 8px;
    max-width: calc(100% - 16px); overflow-x: auto;
  }
  .tool {
    min-width: 64px; padding: 6px 8px 5px; border-radius: 12px; background: #fff; border: 2px solid var(--line);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px;
    box-shadow: 0 3px 0 rgba(59,47,42,.15); flex-shrink: 0;
  }
  .tool .icon { width: 30px; height: 22px; display: grid; place-items: center; }
  .tool .cost { font-family: 'Gowun Dodum', sans-serif; font-size: 11px; color: var(--ink-soft); }
  .tool.active { border-color: var(--ink); background: #fff3d9; transform: translateY(-2px); }
  .tool.hidden { display: none; }
  .sep { width: 2px; background: var(--line); margin: 4px 2px; flex-shrink: 0; }
  .action { padding: 0 14px; border-radius: 12px; font-size: 16px; flex-shrink: 0; box-shadow: 0 3px 0 rgba(59,47,42,.2); }
  .action.ghost { background: #fff; border: 2px solid var(--line); }
  .action.go { background: var(--red); color: #fff; font-size: 18px; padding: 0 18px; }
  .action:active, .tool:active { transform: translateY(2px); box-shadow: none; }

  /* 지진 중 표시 */
  #simPanel {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    display: none; gap: 12px; align-items: center; padding: 10px 14px;
    max-width: calc(100% - 16px);
  }
  #simPanel.show { display: flex; }
  #phaseText { font-family: 'Jua', sans-serif; font-size: 18px; min-width: 120px; }
  #seismo { width: 200px; height: 52px; background: #fff; border-radius: 8px; border: 1px solid var(--line); }
  #simPanel .action { height: 40px; }

  /* 토스트 */
  #toast {
    position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px;
    opacity: 0; transition: .25s; pointer-events: none; text-align: center; max-width: calc(100% - 32px);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 오버레이 공통 */
  .overlay {
    position: absolute; inset: 0; display: none; place-items: center;
    background: rgba(59, 47, 42, .35); padding: 16px; overflow-y: auto;
  }
  .overlay.show { display: grid; }
  .panel {
    background: var(--paper); border: 3px solid var(--line); border-radius: 22px; box-shadow: 0 8px 0 rgba(59,47,42,.2);
    padding: 22px; width: min(560px, 100%); text-align: center;
  }
  .panel h1 { font-family: 'Jua', sans-serif; font-weight: normal; font-size: 40px; margin: 0; letter-spacing: 1px; }
  .panel h1 .crack { color: var(--red); display: inline-block; transform: rotate(-6deg); }
  .panel .sub { color: var(--ink-soft); margin: 6px 0 16px; }
  .howto { text-align: left; background: #fff; border-radius: 14px; padding: 10px 14px; font-size: 14px; line-height: 1.7; margin-bottom: 14px; border: 2px dashed var(--line); }
  .howto b { font-family: 'Jua', sans-serif; font-weight: normal; }
  #levelList { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .lvBtn {
    background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px; text-align: left;
    box-shadow: 0 3px 0 rgba(59,47,42,.15); display: flex; flex-direction: column; gap: 4px;
  }
  .lvBtn .n { font-size: 16px; }
  .lvBtn .meta { font-family: 'Gowun Dodum', sans-serif; font-size: 12px; color: var(--ink-soft); }
  .lvBtn .stars { font-size: 16px; letter-spacing: 2px; color: #f2b01e; }
  .lvBtn .stars .off { color: #e3d6c2; }
  .lvBtn.locked { opacity: .5; cursor: not-allowed; }
  .lvBtn:not(.locked):hover { border-color: var(--orange); }

  #resultTitle { font-family: 'Jua', sans-serif; font-size: 34px; margin: 0; }
  #resultStars { font-size: 44px; letter-spacing: 6px; margin: 6px 0; color: #f2b01e; }
  #resultStars .off { color: #e3d6c2; }
  #resultStars span { display: inline-block; animation: pop .4s backwards; }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.3); } to { transform: scale(1); } }
  #resultMsg { margin: 0 0 12px; line-height: 1.6; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .stat { background: #fff; border-radius: 12px; padding: 8px 4px; border: 2px solid var(--line); }
  .stat .k { font-size: 12px; color: var(--ink-soft); }
  .stat .v { font-family: 'Jua', sans-serif; font-size: 20px; }
  .btnRow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .big { padding: 12px 20px; border-radius: 14px; font-size: 18px; box-shadow: 0 4px 0 rgba(59,47,42,.2); }
  .big.primary { background: var(--orange); color: #fff; }
  .big.plain { background: #fff; border: 2px solid var(--line); }
  .big:active { transform: translateY(2px); box-shadow: none; }

  #loading { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Jua', sans-serif; font-size: 20px; }

  @media (max-width: 640px) {
    #levelInfo .title { font-size: 15px; }
    #budgetBox { min-width: 128px; }
    #budgetText { font-size: 16px; }
    #starGuide { display: none; }
    #tip { top: 92px; font-size: 13px; }
    .tool { min-width: 54px; font-size: 13px; padding: 5px 6px 4px; }
    .action { padding: 0 10px; font-size: 14px; }
    .action.go { font-size: 15px; padding: 0 12px; }
    #toolbar { flex-wrap: wrap; justify-content: center; width: calc(100% - 16px); gap: 6px; }
    #toolbar .tool { flex: 1 1 17%; min-width: 0; white-space: nowrap; }
    #toolbar .sep { display: none; }
    #toolbar .action { flex: 1 1 40%; height: 40px; }
    #simPanel { flex-wrap: wrap; justify-content: center; width: calc(100% - 16px); gap: 8px; }
    #phaseText { flex: 1 1 100%; text-align: center; font-size: 15px; min-width: 0; }
    #seismo { width: 110px; height: 40px; }
    #simPanel .action { height: 38px; }
    .panel h1 { font-size: 32px; }
    .stats .v { font-size: 17px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="loading">불러오는 중…</div>

  <div id="hud">
    <div id="levelInfo" class="card">
      <div class="title" id="lvTitle">-</div>
      <div class="chips">
        <span class="chip soil" id="lvSoil">-</span>
        <span class="chip quake" id="lvQuake">-</span>
        <span class="chip" id="lvTarget">-</span>
      </div>
    </div>
    <div id="topRight">
      <div id="budgetBox" class="card">
        <div class="label">사용한 예산</div>
        <div id="budgetText">0 / 0</div>
        <div id="budgetBar"><div id="budgetFill"></div></div>
        <div id="starGuide"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <button class="iconBtn" id="btnMenu" title="단계 선택">☰</button>
        <button class="iconBtn" id="btnSound" title="소리">🔊</button>
        <button class="iconBtn" id="btnHelp" title="도움말">?</button>
      </div>
    </div>
  </div>

  <div id="tip" class="card hidden"><span class="face">👷</span><span id="tipText"></span><button id="tipClose" aria-label="닫기">✕</button></div>

  <div id="toolbar" class="card">
    <button class="tool active" data-tool="column"><span class="icon"><svg width="10" height="22"><rect x="1" y="0" width="8" height="22" rx="2" fill="#f2994a"/></svg></span>기둥<span class="cost">100</span></button>
    <button class="tool" data-tool="beam"><span class="icon"><svg width="28" height="10"><rect x="0" y="1" width="28" height="8" rx="2" fill="#f6c344"/></svg></span>보<span class="cost">80</span></button>
    <button class="tool" data-tool="brace"><span class="icon"><svg width="26" height="22"><line x1="3" y1="20" x2="23" y2="2" stroke="#3cb4a0" stroke-width="5" stroke-linecap="round"/></svg></span>가새<span class="cost">60</span></button>
    <button class="tool hidden" data-tool="iso"><span class="icon"><svg width="26" height="16"><rect x="1" y="3" width="24" height="10" rx="5" fill="#8e6bd8"/></svg></span>면진<span class="cost">250</span></button>
    <button class="tool" data-tool="erase"><span class="icon" style="font-size:18px">🧽</span>지우개<span class="cost">&nbsp;</span></button>
    <div class="sep"></div>
    <button class="action ghost" id="btnClear">전부 지우기</button>
    <button class="action go" id="btnStart">지진 시작!</button>
  </div>

  <div id="simPanel" class="card">
    <div id="phaseText">자중 확인 중…</div>
    <canvas id="seismo" width="400" height="104"></canvas>
    <button class="action ghost" id="btnSpeed">2배속</button>
    <button class="action ghost" id="btnStop">다시 설계</button>
  </div>

  <div id="toast"></div>

  <div id="titleScreen" class="overlay show">
    <div class="panel">
      <h1>지진 <span class="crack">설계사</span></h1>
      <p class="sub">예산 안에서 튼튼한 건물을 짓고, 지진을 버텨 주민을 지켜 주세요!</p>
      <div class="howto">
        <b>① 짓기</b> 아래 도구에서 기둥·보·가새를 골라 격자를 누르면 놓여요. 누른 채로 끌면 여러 개를 한 번에 놓을 수 있어요.<br>
        <b>② 입주층</b> 빨간 점선 높이에 보를 모두 놓으면 주민이 들어와요.<br>
        <b>③ 지진</b> '지진 시작!'을 눌러 입주층이 무너지지 않으면 성공! 예산을 아낄수록 별이 늘어요.
      </div>
      <div id="levelList"></div>
    </div>
  </div>

  <div id="resultScreen" class="overlay">
    <div class="panel">
      <p id="resultTitle">성공!</p>
      <div id="resultStars"></div>
      <p id="resultMsg"></p>
      <div class="stats">
        <div class="stat"><div class="k">사용 예산</div><div class="v" id="stCost">-</div></div>
        <div class="stat"><div class="k">부서진 부재</div><div class="v" id="stBroken">-</div></div>
        <div class="stat"><div class="k">최대 흔들림</div><div class="v" id="stDrift">-</div></div>
      </div>
      <div class="btnRow">
        <button class="big plain" id="btnView">구경하기</button>
        <button class="big plain" id="btnRetry">다시 설계</button>
        <button class="big primary" id="btnNext">다음 단계</button>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
