<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>딱! 딱지치기 - 추억의 딱지치기 게임 (Ddakji Slam)</title>
<meta name="description" content="설치 없이 바로 하는 무료 딱지치기 게임. 조준하고, 힘을 모아, 딱! AI 대결·2인용·혼자 하기와 딱지 모음집.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a2e1e;--cream:#fff8ec;--line:#d9b48a;--red:#f05a4f;--red-d:#b5372f;--blue:#3f8de0;--blue-d:#2a62a3;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:#e9c99b;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:manipulation;word-break:keep-all;}
#app{position:fixed;inset:0;display:flex;flex-direction:column;}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 8px 4px;background:linear-gradient(#f7dfb8,#e9c99b);}
.pchip{flex:1;min-width:0;background:var(--cream);border:3px solid var(--line);border-radius:14px;height:46px;display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.1);transition:transform .2s;}
.pchip.on{border-color:var(--red);box-shadow:0 3px 0 var(--red-d);transform:translateY(-1px);}
.pchip .face{font-size:22px;flex:0 0 auto;}
.pchip .info{display:flex;flex-direction:column;line-height:1.1;min-width:0;}
.pchip .nm{font-size:13px;color:#8a6a4a;overflow:hidden;text-overflow:ellipsis;}
.pchip .sc{font-size:18px;letter-spacing:1px;}
.ibtn{width:46px;height:46px;border-radius:12px;border:3px solid var(--line);background:var(--cream);font-size:19px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.1);flex:0 0 auto;color:var(--ink);font-family:inherit;}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.1);}
#stage{flex:1;position:relative;min-height:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:14px;z-index:10;}
.overlay.show{display:flex;}
.dim{background:rgba(70,40,20,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;}
.panel{background:var(--cream);border:4px solid #c98a4b;border-radius:26px;padding:18px 16px;width:100%;max-width:380px;max-height:100%;overflow:auto;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.16);animation:pop .25s ease-out;}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.title{font-size:40px;color:var(--red);text-shadow:0 3px 0 #fff,0 5px 0 rgba(0,0,0,.12);line-height:1.1;}
.sub{font-size:16px;margin:6px 0 10px;}
.howto{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:9px 12px;font-size:15px;line-height:1.6;text-align:left;margin-bottom:6px;}
.opt{margin:9px 0;text-align:left;}
.opt label{display:block;font-size:14px;color:#8a6a4a;margin-bottom:4px;}
.seg{display:flex;gap:6px;}
.seg button{flex:1;border:2px solid #ecd2ae;background:#fff;border-radius:12px;padding:8px 2px;font-family:inherit;font-size:16px;color:var(--ink);cursor:pointer;}
.seg button.on{background:#ffe0d6;border-color:var(--red);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);}
.btn{display:block;width:100%;border:none;border-radius:16px;padding:13px 10px;margin-top:12px;font-family:inherit;font-size:21px;color:#fff;cursor:pointer;background:var(--red);box-shadow:0 5px 0 var(--red-d);}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-d);}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 var(--blue-d);}
.btn.blue:active{box-shadow:0 2px 0 var(--blue-d);}
.btn.plain{background:#ecdcc0;color:var(--ink);box-shadow:0 5px 0 #c9ad83;}
.btn.plain:active{box-shadow:0 2px 0 #c9ad83;}
.row{display:flex;gap:8px;}
.row .btn{flex:1;}
.rec{margin-top:10px;font-size:15px;}
.types{display:flex;gap:6px;}
.types button{flex:1;border:2px solid #ecd2ae;background:#fff;border-radius:14px;padding:8px 4px;font-family:inherit;color:var(--ink);cursor:pointer;}
.types button.on{background:#ffe0d6;border-color:var(--red);}
.types b{display:block;font-size:17px;font-weight:normal;}
.types small{display:block;font-size:12px;color:#8a6a4a;line-height:1.35;margin-top:2px;}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.grid button{aspect-ratio:1;border:2px solid #ecd2ae;border-radius:12px;font-size:22px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;}
.grid button span{font-size:11px;color:#5a4030;margin-top:3px;}
.grid button.on{border:3px solid var(--red);transform:scale(1.04);}
.grid button.lock{background:#e6dccd !important;color:#a99;cursor:default;}
.resEmoji{font-size:66px;line-height:1.1;}
.resTitle{font-size:32px;color:var(--red);}
.resMsg{font-size:16px;margin:4px 0 10px;}
.resInfo{background:#fff;border:2px solid #ecd2ae;border-radius:14px;padding:10px;font-size:16px;line-height:1.7;}
.unlock{display:inline-block;background:#ffd84d;border-radius:12px;padding:4px 12px;font-size:16px;margin-top:8px;animation:wig .6s infinite alternate;}
@keyframes wig{from{transform:rotate(-4deg)}to{transform:rotate(4deg) scale(1.06)}}
/* ===== 만화 외곽선 + 공책 ===== */
:root{--ol:#2a1a10;}
.pchip,.ibtn{border:2.5px solid var(--ol);background:#fffdf4;box-shadow:0 3px 0 var(--ol);}
.pchip.on{border-color:var(--ol);background:#ffe9e2;box-shadow:0 3px 0 var(--ol),0 0 0 3px #ff9a8a inset;}
.ibtn.off{opacity:.45;}
.panel{position:relative;border:3px solid var(--ol);border-radius:20px;box-shadow:0 7px 0 var(--ol);padding-top:30px;
  background-color:#fffdf6;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,#dce9f7 27px,#dce9f7 28px);background-attachment:local;}
.panel::before{content:'';position:absolute;left:18px;right:18px;top:9px;height:11px;
  background:radial-gradient(circle at 6px 5.5px,#efe3cf 0 3.2px,var(--ol) 3.6px 4.6px,transparent 5px) repeat-x;background-size:24px 11px;}
.title{-webkit-text-stroke:1.6px var(--ol);text-shadow:0 4px 0 var(--ol);letter-spacing:1px;}
.resTitle{-webkit-text-stroke:1.2px var(--ol);text-shadow:0 3px 0 var(--ol);}
.btn{border:2.5px solid var(--ol)!important;box-shadow:0 4px 0 var(--ol)!important;}
.btn:active{box-shadow:0 1px 0 var(--ol)!important;}
.btn.plain{background:#fff3d6;}
.seg button,.types button,.grid button{border-width:2px;border-color:#cdb08a;}
.seg button.on,.types button.on{border-color:var(--ol);box-shadow:0 2px 0 var(--ol);}
.grid button.on{border:3px solid var(--ol);}
.grid button{position:relative;}
.grid button i{position:absolute;top:2px;right:3px;font-style:normal;font-size:12px;}
.grid button.shiny{box-shadow:0 0 0 2px #fff inset,0 0 10px #ffd84d;}
.howto,.resInfo{background:rgba(255,255,255,.88);}
.unlock{border:2px solid var(--ol);}
.seg.stages button{font-size:14px;padding:7px 1px;}
#daily{margin-top:10px;background:#fff6dc;border:2px dashed #e0a422;border-radius:14px;padding:8px 10px;font-size:14px;line-height:1.5;text-align:left;}
#daily span{color:#b07800;font-size:13px;}
#daily .ok{color:#2f9e5b;}
#daily.done{background:#e8f8e8;border-color:#5fbf5a;}
#rimRow{display:flex;gap:5px;flex-wrap:wrap;}
#rimRow button{flex:1;min-width:60px;border:2px solid #cdb08a;background:#fff;border-radius:12px;padding:7px 2px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.2;}
#rimRow button small{display:block;font-size:10px;color:#8a6a4a;}
#rimRow button.on{border-color:var(--ol);box-shadow:0 2px 0 var(--ol);background:#ffe9e2;}
#rimRow button.lock{background:#eee5d6;cursor:default;}
.ach{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid #cdb08a;border-radius:14px;padding:7px 10px;margin-bottom:6px;text-align:left;}
.ach>span{font-size:26px;}
.ach b{display:block;font-weight:normal;font-size:16px;}
.ach small{font-size:12px;color:#6b4e35;}
.ach.lock{opacity:.5;}
#achList{max-height:52vh;overflow:auto;}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-140%);background:#fffdf4;border:3px solid #ffd84d;border-radius:16px;padding:6px 14px;display:flex;gap:10px;align-items:center;z-index:30;box-shadow:0 4px 0 var(--ol);transition:transform .35s;pointer-events:none;;opacity:0;visibility:hidden;transition:transform .35s,opacity .35s,visibility .35s}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;}
#toast span{font-size:26px;}
#toast small{display:block;font-size:12px;color:#b07800;}
#toast b{font-weight:normal;font-size:16px;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="pchip" id="p0"><span class="face" id="p0f">🙂</span><span class="info"><span class="nm" id="p0n">나</span><span class="sc" id="p0s">○○</span></span></div>
    <div class="pchip" id="p1"><span class="face" id="p1f">🤖</span><span class="info"><span class="nm" id="p1n">AI</span><span class="sc" id="p1s">○○</span></span></div>
    <button class="ibtn" id="btnHome" aria-label="처음으로">🏠</button>
    <button class="ibtn" id="btnMusic" aria-label="배경 음악 켜기/끄기">🎵</button>
    <button class="ibtn" id="btnSound" aria-label="효과음 켜기/끄기">🔊</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="toast"></div></div>

  <div class="overlay dim show" id="menu">
    <div class="panel">
      <div class="title">딱! 딱지치기</div>
      <p class="sub">상대 딱지를 내리쳐서 뒤집으면 내 거!</p>
      <div class="howto">
        ① 조준점이 움직일 때 눌러 <b>칠 곳</b>을 정해요<br>
        ② 힘 게이지가 <b>초록 칸</b>에 올 때 눌러요<br>
        ③ 딱지 <b>가장자리</b>를 칠수록 잘 뒤집혀요
      </div>
      <div class="opt"><label>게임 방식</label>
        <div class="seg" data-key="mode"><button data-v="ai">🤖 AI 대결</button><button data-v="pvp">👫 2인용</button><button data-v="solo">🙂 혼자</button></div>
      </div>
      <div class="opt" id="levelOpt"><label>AI 난이도</label>
        <div class="seg" data-key="level"><button data-v="easy">쉬움</button><button data-v="normal">보통</button><button data-v="hard">어려움</button></div>
      </div>
      <div class="opt"><label>장소</label>
        <div class="seg stages" data-key="stage"><button data-v="auto">🎲 랜덤</button><button data-v="alley">🧱 골목</button><button data-v="class">🏫 교실</button><button data-v="park">🛝 놀이터</button></div>
      </div>
      <button class="btn" id="btnNext">딱지 고르기</button>
      <div class="row"><button class="btn plain" id="btnCol">📒 모음집·꾸미기</button><button class="btn plain" id="btnAch">🏅 업적</button></div>
      <div id="daily"></div>
      <div class="rec" id="menuRec"></div>
    </div>
  </div>

  <div class="overlay dim" id="select">
    <div class="panel">
      <div class="title" style="font-size:28px" id="selTitle">내 딱지 고르기</div>
      <div class="opt"><label>딱지 종류</label>
        <div class="types" id="types">
          <button data-v="light"><b>가벼운 딱지</b><small>조준이 느려 맞히기 쉬움<br>대신 쉽게 뒤집혀요</small></button>
          <button data-v="normal"><b>보통 딱지</b><small>무난한<br>균형형</small></button>
          <button data-v="heavy"><b>두꺼운 딱지</b><small>세게 치고 잘 버텨요<br>힘 게이지가 빨라요</small></button>
        </div>
      </div>
      <div class="opt"><label id="patLabel">무늬 (모은 딱지)</label><div class="grid" id="patGrid"></div></div>
      <div class="row"><button class="btn plain" id="btnSelBack">뒤로</button><button class="btn" id="btnSelOk">시작!</button></div>
    </div>
  </div>

  <div class="overlay dim" id="col">
    <div class="panel">
      <div class="title" style="font-size:28px">📒 딱지 모음집</div>
      <p class="sub" id="colCount">0 / 12</p>
      <div class="grid" id="colGrid"></div>
      <div class="opt" style="margin-top:12px"><label>🎨 내 딱지 테두리 꾸미기 (업적으로 열려요)</label><div id="rimRow"></div></div>
      <p class="sub" style="font-size:13px;color:#8a6a4a;margin-top:10px">AI를 이기거나 혼자 하기에서 5장씩 뒤집으면 새 딱지! 가끔 ✨반짝 딱지가 나와요.<br>🌟 특별 딱지는 📅 오늘의 도전을 깨면 받아요.</p>
      <button class="btn plain" id="btnColClose">닫기</button>
    </div>
  </div>

  <div class="overlay dim" id="achs">
    <div class="panel">
      <div class="title" style="font-size:28px">🏅 업적</div>
      <p class="sub" id="achCount"></p>
      <div id="achList"></div>
      <button class="btn plain" id="btnAchClose">닫기</button>
    </div>
  </div>

  <div class="overlay dim" id="confirm">
    <div class="panel">
      <div class="title" style="font-size:28px">처음으로 갈까요?</div>
      <p class="sub">지금 하던 판은 사라져요.</p>
      <div class="row"><button class="btn plain" id="btnNo">계속하기</button><button class="btn" id="btnYes">처음으로</button></div>
    </div>
  </div>

  <div class="overlay dim" id="result">
    <div class="panel">
      <div class="resEmoji" id="resEmoji">🎉</div>
      <div class="resTitle" id="resTitle">이겼어요!</div>
      <div class="resMsg" id="resMsg"></div>
      <div class="resInfo" id="resInfo"></div>
      <div id="resUnlock"></div>
      <div class="row"><button class="btn" id="btnAgain">다시 하기</button><button class="btn plain" id="btnMenu">처음으로</button></div>
      <button class="btn plain" id="btnShot" style="font-size:17px;padding:9px">📸 기록 카드 저장</button>
    </div>
  </div>
</div>
<script>
/* 딱! 딱지치기 (Ddakji Slam) v2 - 쉬는시간 오락실 */
(() => {
  'use strict';

  // ===== 데이터 =====

  const ACH = [

  // ===== 판정 (원래 규칙 그대로) =====

      const myThrow = striker && !striker.top && phase === 'throw';
      const sleeve = opt.mode === 'pvp' ? '#ff6f6f' : '#ff8a8a';
      if (!myThrow && !(striker && !striker.top && (phase === 'result' || phase === 'wait'))) {
        const bob = Math.sin(clock * 3) * 4, isMine = cur === 0 && (phase === 'banner' || phase === 'aim' || phase === 'power');
        if (isMine) drawDdakji(L.hx, L.hy + bob, L.S * 0.62 * TYPES[bottomP.type].size, bottomP.pat, 0, 8, -0.15, 1, decoOf(bottomP));
        drawHand(L.hx + L.S * 0.12, L.hy - L.S * 0.15 + bob + (isMine ? 0 : L.S * 0.25), sleeve, !isMine);
      } else if (myThrow) {
        const [x, y] = strikerPos();
        if (striker.t < 0.82) drawHand(x + L.S * 0.12, y - L.S * 0.2, sleeve, false);
      } else drawHand(L.hx + L.S * 0.3, L.hy, sleeve, true);
    }
    if (p && p.ai === false && cur === 1 && players.length > 1 && (phase === 'banner' || phase === 'aim' || phase === 'power')) {
      drawDdakji(L.tx + 34 * L.q, L.ty - L.S * 1.0, L.S * 0.5 * TYPES[p.type].size, p.pat, 0, 4, 0.15, 1, decoOf(p));
    }
    if (p && p.ai && (phase === 'banner' || phase === 'aim' || phase === 'power')) {
      drawDdakji(L.tx + 34 * L.q, L.ty - L.S * 1.0, L.S * 0.5 * TYPES[p.type].size, p.pat, 0, 4, 0.15, 1, decoOf(p));
    }
    if (striker) {
      const [x, y, lift] = strikerPos(), t = striker.t;
      const sz = L.S * 0.62 * TYPES[striker.type].size * (1 + lift / L.S * 0.35);
      const off = phase === 'throw' ? 0 : L.S * 0.12 * (lastShot ? lastShot.dir : 1);
      drawDdakji(x + off, (phase === 'throw' ? y + lift : striker.y1 + L.S * 0.18), sz, striker.pat, 0, phase === 'throw' ? lift : 0, 0.4 * (1 - t) + 0.15, 1, striker.deco);
      if (phase === 'throw' && striker.slow && t > 0.72) {
        ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
        for (let i = 0; i < 5; i++) { const dx = (i - 2) * L.S * 0.12; ctx.beginPath(); ctx.moveTo(x + dx, y - L.S * 0.3); ctx.lineTo(x + dx * 1.2, y - L.S * 0.75); ctx.stroke(); }
      }
    }
    dust.forEach(d => {
      ctx.globalAlpha = Math.max(0, Math.min(1, d.life * 1.6));
      if (d.paper) { ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.rot); ctx.fillStyle = d.paper; ctx.fillRect(-d.r, -d.r * 0.6, d.r * 2, d.r * 1.2); ctx.strokeStyle = INK; ctx.lineWidth = 1; ctx.strokeRect(-d.r, -d.r * 0.6, d.r * 2, d.r * 1.2); ctx.restore(); }
      else { ctx.fillStyle = curStage === 'class' ? '#e8d6b8' : curStage === 'park' ? '#e2c48a' : '#c69a62'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill(); }
    });
    ctx.globalAlpha = 1;
    drawComic();
    ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.45})`; ctx.fillRect(0, 0, L.w, L.h); }
    if (phase === 'throw' && striker && striker.slow && striker.t > 0.72) {
      const gr = ctx.createRadialGradient(L.w / 2, L.h / 2, Math.min(L.w, L.h) * 0.3, L.w / 2, L.h / 2, Math.max(L.w, L.h) * 0.7);
      gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(20,10,0,.35)'); ctx.fillStyle = gr; ctx.fillRect(0, 0, L.w, L.h);
    }
    if (state === 'play' && p) {
      if (phase === 'aim') drawGuide(p.ai ? `${p.per.name.split(' ').pop()}이(가) 조준 중…` : '눌러서 칠 곳을 정해요 (가장자리!)');
      else if (phase === 'power') drawGuide(p.ai ? '힘을 모으는 중…' : '초록 칸에서 눌러 힘을 정해요');
    }
    drawSoloInfo();
    pops.forEach(pp => {
      const fs = pp.big ? Math.max(24, Math.min(40, L.w / 13)) : Math.max(16, L.w / 24);
      ctx.globalAlpha = Math.max(0, Math.min(1, (1.4 - pp.t) * 2));
      const sc = pp.t < 0.1 ? 0.6 + pp.t * 7 : 1.3 - Math.min(0.3, (pp.t - 0.1) * 1.5);
      ctx.save(); ctx.translate(pp.x, pp.y - pp.t * 26); ctx.scale(sc, sc);
      bigText(pp.text, 0, 0, fs, pp.color, 6);
      ctx.restore(); ctx.globalAlpha = 1;
    });
    if (phase === 'banner' && banner) {
      const a = Math.max(0, Math.min(1, phaseT * 5, (0.9 - phaseT) * 5));
      ctx.globalAlpha = a;
      const fs = Math.max(28, Math.min(L.w, 500) / 10), bw = Math.min(L.w * 0.8, 440), by = L.h * 0.3;
      rr(L.w / 2 - bw / 2 + 4, by + 6, bw, fs * 2, 20); ctx.fillStyle = INK; ctx.fill();
      rr(L.w / 2 - bw / 2, by, bw, fs * 2, 20); ink(ctx, '#fffdf6', 3);
      ctx.fillStyle = INK; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(L.w / 2 - bw / 2 + 24 + i * (bw - 48) / 8, by + 9, 3, 0, Math.PI * 2); ctx.fill(); }
      bigText(banner.text, L.w / 2, by + fs * 1.05, fs * 0.9, '#ff6f5f');
      ctx.globalAlpha = 1;
    }
  }
  function popText(text, x, y, color, big) { pops.push({ text, x, y, color, big, t: 0 }); }

  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0);
    lastT = t;
    if (canvas.width < 2) layout();
    if (hitStop > 0) hitStop = Math.max(0, hitStop - dt); else update(dt);
    updateFx(dt);
    try { render(); } catch (e) { /* 다음 프레임에서 다시 그림 */ }
  }

  // ===== HUD =====
  function updateHud() {
    const show = i => {
      const chip = $('p' + i), p = players[i];
      if (!p) { chip.classList.add('hidden'); return; }
      chip.classList.remove('hidden');
      $('p' + i + 'f').textContent = p.face;
      $('p' + i + 'n').textContent = p.ai ? p.per.name : p.name;
      $('p' + i + 's').textContent = solo ? `${solo.count}장 · ${'❤️'.repeat(Math.max(0, solo.lives))}` : '●'.repeat(p.wins) + '○'.repeat(Math.max(0, 2 - p.wins));
      chip.classList.toggle('on', players.length > 1 && i === cur && state === 'play');
    };
    show(0); show(1);
    $('btnSound').textContent = soundOn ? '🔊' : '🔇';
    $('btnMusic').classList.toggle('off', opt.music !== 'on');
  }

  // ===== 입력 =====
  canvas.addEventListener('pointerdown', e => { ensureAudio(); e.preventDefault(); press(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (state === 'play') { e.preventDefault(); ensureAudio(); press(); }
    }
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ===== 메뉴·선택 화면 =====
  function hideAll() { ['menu', 'select', 'col', 'confirm', 'result', 'achs'].forEach(id => $(id).classList.remove('show')); }
  function syncMenu() {
    document.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(opt[seg.dataset.key]))));
    $('levelOpt').classList.toggle('hidden', opt.mode !== 'ai');
    let t;
    if (opt.mode === 'ai') { const r = rec.ai[opt.level] || { w: 0, l: 0 }; t = `🧒 상대: <b>${PERSONA[opt.level].name}</b><br>🏆 ${AI_LV[opt.level].name} 전적: <b>${r.w}승 ${r.l}패</b> · 3판 2선승`; }
    else if (opt.mode === 'solo') t = `🏆 최고 기록: <b>${rec.soloBest || 0}장</b> · 목숨 3개로 연속 뒤집기`;
    else t = '한 기기로 번갈아 쳐요 · 3판 2선승';
    $('menuRec').innerHTML = t + `<br>📒 모은 딱지 <b>${col.length}</b> / ${NALL} · ✨ 반짝 <b>${prog.shiny.length}</b>`;
    const dq = dailyToday(), done = !!prog.daily[todayKey()];
    $('daily').innerHTML = `📅 <b>오늘의 도전</b> ${done ? '<span class="ok">완료 ✓</span>' : '<span>· 특별 딱지 보상</span>'}<br>${dq.text}`;
    $('daily').classList.toggle('done', done);
  }
  document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    opt[seg.dataset.key] = b.dataset.v; saveOpt(); ensureAudio(); sfx.click(); syncMenu();
    if (seg.dataset.key === 'stage') setStage(opt.stage === 'auto' ? STAGE_KEYS[Math.floor(Math.random() * STAGE_KEYS.length)] : opt.stage);
  }));
  function showMenu() {
    state = 'menu'; phase = 'idle'; players = []; solo = null; target = null; striker = null; opp = { face: 'idle', faceT: 0, bubble: null, who: null };
    hideAll(); syncMenu(); $('menu').classList.add('show'); updateHud();
  }
  function patGrid(el, sel, onPick) {
    el.innerHTML = '';
    ANIMALS.forEach((a, i) => {
      const b = document.createElement('button');
      const has = col.includes(i), sh = prog.shiny.includes(i);
      b.innerHTML = has ? `${a[0]}<span>${a[1]}</span>${sh ? '<i>✨</i>' : ''}` : `${i >= NREG ? '🌟' : '🔒'}<span>${i >= NREG ? '특별' : '???'}</span>`;
      b.style.background = has ? `linear-gradient(135deg, ${a[2]} 50%, ${a[3]} 50%)` : '';
      if (!has) b.classList.add('lock');
      if (sh) b.classList.add('shiny');
      if (has && i === sel) b.classList.add('on');
      if (has && onPick) b.addEventListener('click', () => { onPick(i); sfx.click(); });
      el.appendChild(b);
    });
  }
  function showSelect(step) {
    selStep = step;
    const k = step === 0 ? 'type0' : 'type1', pk = step === 0 ? 'pat0' : 'pat1';
    if (!col.includes(opt[pk])) opt[pk] = col[step % col.length];
    $('selTitle').textContent = opt.mode === 'pvp' ? `${step + 1}P 딱지 고르기` : '내 딱지 고르기';
    $('btnSelOk').textContent = opt.mode === 'pvp' && step === 0 ? '다음' : '시작!';
    document.querySelectorAll('#types button').forEach(b => {
      b.classList.toggle('on', b.dataset.v === opt[k]);
      b.onclick = () => { opt[k] = b.dataset.v; saveOpt(); sfx.click(); showSelect(step); };
    });
    patGrid($('patGrid'), opt[pk], i => { opt[pk] = i; saveOpt(); showSelect(step); });
    hideAll(); $('select').classList.add('show');
  }
  function showCol() {
    $('colCount').textContent = `${col.length} / ${NALL} · ✨ 반짝 ${prog.shiny.length} · 눌러서 내 딱지로 정해요`;
    patGrid($('colGrid'), opt.pat0, i => { opt.pat0 = i; saveOpt(); showCol(); });
    const rb = $('rimRow'); rb.innerHTML = '';
    RIMS.forEach((r, i) => {
      const b = document.createElement('button'), ok = hasRim(i);
      b.innerHTML = ok ? r.name : `🔒<small>${ACH.find(a => a[0] === r.need)[2]}</small>`;
      b.className = (opt.rim === i ? 'on' : '') + (ok ? '' : ' lock');
      if (ok) b.addEventListener('click', () => { opt.rim = i; saveOpt(); sfx.click(); showCol(); });
      rb.appendChild(b);
    });
    hideAll(); $('col').classList.add('show');
  }
  function showAchs() {
    const box = $('achList'); box.innerHTML = '';
    const n = ACH.filter(a => prog.ach[a[0]]).length;
    $('achCount').textContent = `${n} / ${ACH.length} · 완벽 누적 ${prog.perfects || 0}번 · 오늘의 도전 ${prog.dailyN || 0}번`;
    ACH.forEach(([id, ic, nm, ds]) => {
      const d = document.createElement('div'); d.className = 'ach' + (prog.ach[id] ? '' : ' lock');
      d.innerHTML = `<span>${prog.ach[id] ? ic : '🔒'}</span><div><b>${nm}</b><small>${ds}</small></div>`;
      box.appendChild(d);
    });
    hideAll(); $('achs').classList.add('show');
  }
  // 기록 카드
  function recordCard() {
    const r = lastRes || {}, c = document.createElement('canvas'); c.width = 800; c.height = 450;
    const g = c.getContext('2d');
    g.fillStyle = '#f2d6a8'; g.fillRect(0, 0, 800, 450);
    rr(46, 52, 716, 370, 26, g); g.fillStyle = INK; g.fill();
    rr(40, 40, 716, 370, 26, g); g.fillStyle = '#fffdf6'; g.fill(); g.lineWidth = 5; g.strokeStyle = INK; g.stroke();
    g.strokeStyle = '#dce9f7'; g.lineWidth = 2; for (let y = 96; y < 400; y += 34) { g.beginPath(); g.moveTo(60, y); g.lineTo(736, y); g.stroke(); }
    for (let x = 70; x < 730; x += 30) { g.beginPath(); g.arc(x, 56, 5, 0, Math.PI * 2); g.fillStyle = INK; g.fill(); }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '54px Jua, sans-serif'; g.lineWidth = 8; g.strokeStyle = INK; g.strokeText('딱! 딱지치기', 400, 120); g.fillStyle = '#ff6f5f'; g.fillText('딱! 딱지치기', 400, 120);
    g.font = '60px Jua, sans-serif'; g.fillStyle = '#e0a422'; g.fillText(`${r.emoji || ''} ${r.title || ''}`, 400, 205);
    g.fillStyle = '#4a2e1e'; g.font = '24px Jua, sans-serif';
    (r.lines || []).slice(0, 4).forEach((line, i) => g.fillText(line, 400, 262 + i * 30));
    g.fillStyle = '#8a6a4a'; g.font = '20px Jua, sans-serif'; g.fillText(`${new Date().toLocaleDateString('ko-KR')} · ${STAGES[r.stage] || ''} · 쉬는시간 오락실 smile-willow.tistory.com`, 400, 392);
    return c;
  }
  $('btnShot').addEventListener('click', () => {
    try { const a = document.createElement('a'); a.download = 'ddakji-record.png'; a.href = recordCard().toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove(); sfx.unlock(); } catch (e) { /* 무시 */ }
  });
  $('btnNext').addEventListener('click', () => { ensureAudio(); showSelect(0); });
  $('btnSelBack').addEventListener('click', () => { if (selStep === 1) showSelect(0); else showMenu(); });
  $('btnSelOk').addEventListener('click', () => {
    if (opt.mode === 'pvp' && selStep === 0) { showSelect(1); return; }
    startGame();
  });
  $('btnCol').addEventListener('click', () => { ensureAudio(); showCol(); });
  $('btnColClose').addEventListener('click', showMenu);
  $('btnAch').addEventListener('click', () => { ensureAudio(); showAchs(); });
  $('btnAchClose').addEventListener('click', showMenu);
  $('btnAgain').addEventListener('click', startGame);
  $('btnMenu').addEventListener('click', showMenu);
  $('btnHome').addEventListener('click', () => { if (state === 'play') $('confirm').classList.add('show'); else showMenu(); });
  $('btnNo').addEventListener('click', () => $('confirm').classList.remove('show'));
  $('btnYes').addEventListener('click', showMenu);
  $('btnSound').addEventListener('click', () => {
    soundOn = !soundOn; store.set(KEY_SOUND, soundOn ? '1' : '0');
    ensureAudio(); if (soundOn) sfx.click(); updateHud();
  });
  $('btnMusic').addEventListener('click', () => { opt.music = opt.music === 'on' ? 'off' : 'on'; saveOpt(); ensureAudio(); sfx.click(); updateHud(); });

  let rt = 0;
  const onResize = () => { clearTimeout(rt); rt = setTimeout(layout, 60); };
  window.addEventListener('resize', onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(stageEl);

  layout();
  setStage(opt.stage === 'auto' ? STAGE_KEYS[Math.floor(Math.random() * STAGE_KEYS.length)] : opt.stage);
  showMenu();
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(loop); });
})();

</script>
